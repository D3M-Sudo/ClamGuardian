<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<style>
.t{font:700 26px sans-serif;fill:#111827}.s{font:15px sans-serif;fill:#4b5563}.h{font:700 15px sans-serif;fill:#374151}
.b{stroke-width:2;rx:13;ry:13}.done{fill:#e5e7eb;stroke:#6b7280}.rel{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.next{fill:#fff7ed;stroke:#c2410c}.later{fill:#f9fafb;stroke:#9ca3af;stroke-dasharray:6 4}
.l{font:700 17px sans-serif;fill:#111827;text-anchor:middle}.d{font:14px sans-serif;fill:#374151;text-anchor:middle}
.a{stroke:#4b5563;stroke-width:2.4;fill:none;marker-end:url(#ar)}
</style>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker></defs>
<rect width="1100" height="650" fill="#fff"/>
<text x="35" y="42" class="t">ClamGuardian — roadmap di produzione</text>
<text x="35" y="68" class="s">Baseline 18 ottobre 2026 · v1.0.0 rilasciata</text>
<text x="35" y="108" class="h">TRAGUARDI COMPLETATI</text>
<rect x="35" y="125" width="220" height="75" class="b done"/><text x="145" y="153" class="l">M0–M3</text><text x="145" y="177" class="d">Core · runner · profili · CLI</text>
<path d="M255 162 H282" class="a"/>
<rect x="287" y="125" width="220" height="75" class="b done"/><text x="397" y="153" class="l">M4–M6</text><text x="397" y="177" class="d">Storico · hardening · CI</text>
<path d="M507 162 H534" class="a"/>
