# Release manifest (Flatpak / Flathub submission).
#
# Runtime wheels are prepared from uv.lock on native runners and hash-verified.
# The source is pinned to an immutable tag: Flathub and any reproducible build
# refuse to build from a moving branch. `v1.0.1` is cut from `main` after the
# manual desktop validation and the promotion PRs (docs/reports/RELEASE-1.0.1.md);
# when cutting a new release, update `tag` and add the resulting `commit` so a
# moved tag cannot change the build.
#
# For a build against the working tree use the local manifest:
#   flatpak-builder build-dir io.github.clamguardian.ClamGuardian.local.yml
app-id: io.github.clamguardian.ClamGuardian
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: clamguardian
finish-args:
  # --- GUI -------------------------------------------------------------
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # --- Host ClamAV -----------------------------------------------------
  # clamscan/freshclam are executed through `flatpak-spawn --host` and clamd is
  # reached over its UNIX socket on the host, so the sandbox needs to talk to
  # the flatpak portal and to read the host filesystem (socket + definitions).
  - --talk-name=org.freedesktop.Flatpak
  # Required for libsecret-backed VirusTotal credentials; the feature remains
  # opt-in and fail-closed when the service is unavailable.
  - --talk-name=org.freedesktop.secrets
  - --filesystem=host:ro
  # --- Network ---------------------------------------------------------
  # Only used for explicit, user-initiated third-party database downloads.
  - --share=network
  # --- Application data ------------------------------------------------
  # Quarantine vault, scan history and database state live in the app data dir.
  - --filesystem=xdg-data/clamguardian:create

modules:
  - name: clamguardian
    buildsystem: simple
    build-commands:
      # hatchling è il build-backend dichiarato in pyproject.toml; la wheel viene
      # scaricata come source (con rete) e installata offline dal build-dir.
      # hatchling + le sue dipendenze runtime (packaging, pathspec, pluggy,
      # tomlkit, trove-classifiers) vengono installate in .pep517-build e
      # rese importabili tramite PYTHONPATH: pattern standard Flathub per
      # build backend venduto, nessun download da PyPI durante la build.
      - mkdir -p .pep517-build && pip3 install --no-index --no-deps --target .pep517-build ./hatchling-1.32.4-py3-none-any.whl ./packaging-26.3-py3-none-any.whl ./pathspec-1.1.1-py3-none-any.whl ./pluggy-1.6.0-py3-none-any.whl ./tomlkit-0.15.2-py3-none-any.whl ./trove_classifiers-2026.9.21.13-py3-none-any.whl
      - PYTHONPATH=.pep517-build pip3 install --no-build-isolation --no-deps --no-index --prefix=/app .
      # Dipendenze runtime (cryptography, aiohttp + transitive): tutte elencate
      # esplicitamente come wheel locali, così pip non cerca la rete.
      - pip3 install --no-index --no-deps --prefix=/app ./packaging/flatpak/wheelhouse/*.whl
      - install -Dm644 data/io.github.clamguardian.ClamGuardian.desktop /app/share/applications/io.github.clamguardian.ClamGuardian.desktop
      - install -Dm644 data/io.github.clamguardian.ClamGuardian.metainfo.xml /app/share/metainfo/io.github.clamguardian.ClamGuardian.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg /app/share/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/5f/80/91f51f439c05d4ec4623c22928ce16a938d6d793bf709477830823497859/hatchling-1.32.4-py3-none-any.whl
        sha256: 08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c
      - type: file
        url: https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl
        sha256: d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
      - type: file
        url: https://files.pythonhosted.org/packages/f1/d9/7fb5aa316bc299258e68c73ba3bddbc499654a07f151cba08f6153988714/pathspec-1.1.1-py3-none-any.whl
        sha256: a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
      - type: file
        url: https://files.pythonhosted.org/packages/54/20/4d324d65cc6d9205fabedc306948156824eb9f0ee1633355a8f7ec5c66bf/pluggy-1.6.0-py3-none-any.whl
        sha256: e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746
      - type: file
        url: https://files.pythonhosted.org/packages/da/46/7d84138a60a8bd796825b2d38ebe92d0d16501ca57d501b7c5d677401bbc/tomlkit-0.15.2-py3-none-any.whl
        sha256: 05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437
      - type: file
        url: https://files.pythonhosted.org/packages/30/81/0da8afb52a71d0a4f2bd3152357b1a441e393b286374802b9d3addab4ab5/trove_classifiers-2026.9.21.13-py3-none-any.whl
        sha256: 8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17
      - type: dir
        path: wheelhouse
        dest: packaging/flatpak/wheelhouse
      - type: git
        url: https://github.com/D3M-Sudo/ClamGuardian.git
        tag: v1.0.1
