version: 1
script:
  - mkdir -p "$TARGET_APPDIR/opt/python"
  - python3 -m pip install --no-index --no-deps --target "$TARGET_APPDIR/opt/python" "$SOURCE_DIR/wheelhouse/"*.whl
  - cp -a "$SOURCE_DIR/../../clamguardian" "$TARGET_APPDIR/opt/python/"
  - mkdir -p "$TARGET_APPDIR/usr/bin"
  - cc -O2 -Wall -Wextra -Werror "$SOURCE_DIR/clamguardian-launcher.c" -o "$TARGET_APPDIR/usr/bin/clamguardian-launcher"
  - install -Dm644 "$SOURCE_DIR/../../data/io.github.clamguardian.ClamGuardian.desktop" "$TARGET_APPDIR/io.github.clamguardian.ClamGuardian.desktop"
  - sed -i 's|^Exec=.*|Exec=AppRun ui|' "$TARGET_APPDIR/io.github.clamguardian.ClamGuardian.desktop"
  - install -Dm644 "$SOURCE_DIR/../../data/io.github.clamguardian.ClamGuardian.desktop" "$TARGET_APPDIR/usr/share/applications/io.github.clamguardian.ClamGuardian.desktop"
  - sed -i 's|^Exec=.*|Exec=AppRun ui|' "$TARGET_APPDIR/usr/share/applications/io.github.clamguardian.ClamGuardian.desktop"
  - install -Dm644 "$SOURCE_DIR/../../data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg" "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg"
  - install -Dm644 "$SOURCE_DIR/../../data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg" "$TARGET_APPDIR/io.github.clamguardian.ClamGuardian.svg"
  - rsvg-convert -w 256 -h 256 -o "$TARGET_APPDIR/.DirIcon" "$SOURCE_DIR/../../data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg"
AppDir:
  path: ./AppDir
  # APT packages are deployed after the top-level script. Link Python's
  # standard library only after python3.12-minimal has populated the AppDir.
  after_bundle: |
    set -eu
    stdlib_dir="$TARGET_APPDIR/usr/lib/python3.12"
    test -d "$stdlib_dir/encodings"
    mkdir -p "$TARGET_APPDIR/lib"
    ln -sfn ../usr/lib/python3.12 "$TARGET_APPDIR/lib/python3.12"
    test -f "$TARGET_APPDIR/lib/python3.12/encodings/__init__.py"
  app_info:
    id: io.github.clamguardian.ClamGuardian
    name: ClamGuardian
    icon: io.github.clamguardian.ClamGuardian
    version: '{{APP_VERSION}}'
    exec: usr/bin/clamguardian-launcher
    exec_args: $@
  apt:
    arch: '{{APT_ARCH}}'
    sources:
      - sourceline: "deb [arch={{APT_ARCH}}] {{APT_MIRROR}} noble main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb [arch={{APT_ARCH}}] {{APT_MIRROR}} noble-updates main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: "deb [arch={{APT_ARCH}}] {{APT_MIRROR}} noble-security main universe"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
    include:
      - python3
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-secret-1
      - adwaita-icon-theme
      - hicolor-icon-theme
      - gsettings-desktop-schemas
      - python3-cairo
      - libsecret-1-0
      - ca-certificates
    exclude:
      - apt
      - dpkg
AppImage:
  arch: '{{APPIMAGE_ARCH}}'
  file_name: 'ClamGuardian-{{APP_VERSION}}-{{APPIMAGE_ARCH}}.AppImage'
  update-information: None
  sign-key: None
