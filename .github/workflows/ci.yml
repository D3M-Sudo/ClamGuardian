name: CI

on:
  push:
    branches: [main, feature, development]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install GTK/PyGObject build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev gir1.2-gtk-4.0 gir1.2-adw-1 libcairo2-dev pkg-config python3-dev meson ninja-build xvfb xauth
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        # `pip` is upgraded so the runner can build this project's wheel and
        # PyGObject. `setuptools` is deliberately NOT upgraded: neither
        # `hatchling` (this project's build backend) nor `meson-python`
        # (PyGObject's build backend) requires it, and upgrading it was the
        # workaround that used to make the old in-job audit pass. Dependency
        # auditing now runs in the dedicated `audit` job below, against the
        # pinned runtime dependency set.
        run: python -m pip install --upgrade pip && python -m pip install '.[test,gtk]' ruff==0.17.1 mypy==2.4.0 pytest==9.1.1 pytest-asyncio==1.4.0 pyyaml==6.0.3
      - name: Lint
        run: ruff check .
      - name: Type Check
        run: mypy clamguardian
      - name: Test
        # Widget-level tests construct real GTK objects, and GTK4 aborts the
        # interpreter when no display is available. Xvfb gives them a
        # headless X server so they run for real instead of being skipped.
        # Verbose output identifies the last test reached; faulthandler emits
        # thread stacks for a test that blocks. The job timeout is a final bound.
        env:
          GTK_A11Y: none
        run: xvfb-run -a pytest -vv -o faulthandler_timeout=60

  audit:
    name: Dependency audit (pinned runtime set)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install uv and pip-audit
        # Only the audit tooling is installed here. The project itself is never
        # installed in this job, so nothing in this environment can mask or
        # change the outcome of the audit.
        run: python -m pip install --upgrade pip uv pip-audit
      - name: Verify that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Export the pinned runtime dependency set
        run: uv export --frozen --no-emit-project --format requirements-txt > requirements.lock.txt
      - name: Audit the pinned runtime dependency set
        run: pip-audit --strict --progress-spinner off -r requirements.lock.txt

  runtime-python:
    name: Runtime Python (Flatpak 3.14, headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install package and test dependencies
        # The Flatpak runtime ships Python 3.14: exercise the code there even
        # though the main matrix stops at 3.13. No GTK extra: this job checks
        # the interpreter the sandbox actually provides.
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]' pytest==9.1.1 pytest-asyncio==1.4.0 pyyaml==6.0.3
      - name: Test (headless)
        env:
          GTK_A11Y: none
        run: pytest -vv -o faulthandler_timeout=60

  native-packaging:
    name: Native Flatpak packaging (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.14 (GNOME 51 runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install uv and Flatpak tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.5
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb xauth dbus-x11
      - name: Prepare native, lockfile-verified runtime wheelhouse
        run: packaging/flatpak/prepare-wheelhouse.sh
      - name: Install GNOME 51 runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user flathub org.gnome.Platform//51 -y
          flatpak install --user flathub org.gnome.Sdk//51 -y
      - name: Build local Flatpak
        run: flatpak-builder --force-clean --repo=flatpak-repo build-dir packaging/flatpak/io.github.clamguardian.ClamGuardian.local.yml
      - name: Create installable bundle
        run: flatpak build-bundle flatpak-repo "ClamGuardian-ci-linux-${{ matrix.arch }}.flatpak" io.github.clamguardian.ClamGuardian
      - name: Install bundle and verify metadata and CLI
        run: |
          flatpak install --user --bundle "ClamGuardian-ci-linux-${{ matrix.arch }}.flatpak" -y
          test "$(flatpak info --show-ref io.github.clamguardian.ClamGuardian)" = "app/io.github.clamguardian.ClamGuardian/${{ matrix.arch }}/master"
          flatpak run io.github.clamguardian.ClamGuardian version
          flatpak run io.github.clamguardian.ClamGuardian profiles
      - name: Construct complete GTK UI in installed Flatpak runtime
        env:
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- flatpak run --command=python3 io.github.clamguardian.ClamGuardian /app/share/clamguardian/gtk-smoke.py
      - name: Upload tested Flatpak
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClamGuardian-ci-linux-${{ matrix.arch }}
          path: ClamGuardian-ci-linux-${{ matrix.arch }}.flatpak
          retention-days: 14

  native-appimage:
    name: Native AppImage packaging (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate packaging shell syntax
        run: |
          for script in packaging/flatpak/prepare-wheelhouse.sh packaging/appimage/*.sh; do
            bash -n "$script"
          done
          python -m py_compile packaging/smoke/gtk-smoke.py
      - name: Install AppImage prerequisites
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.5
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 file
      - name: Prepare native locked runtime wheelhouse
        run: packaging/appimage/prepare-wheelhouse.sh
      - name: Read package version
        id: package-version
        run: echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
        run: |
          APP_VERSION="${{ steps.package-version.outputs.version }}"
          export APP_VERSION
          packaging/appimage/build-appimage.sh
      - name: Verify CLI, runtime and GTK startup
        env:
          APPIMAGE_ARCH: ${{ matrix.arch }}
          APP_VERSION: ${{ steps.package-version.outputs.version }}
        run: packaging/appimage/test-appimage.sh "dist/ClamGuardian-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')-${{ matrix.arch }}.AppImage"
      - name: Upload tested AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClamGuardian-ci-appimage-${{ matrix.arch }}
          path: dist/ClamGuardian-*-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 14
