# Release manifest (Flatpak / Flathub submission).
#
# The source is pinned to an immutable tag: Flathub and any reproducible build
# refuse to build from a moving branch. The `v1.0.0` tag is created by the 1.0
# release gate (docs/ROADMAP.md, Phase 9); when cutting a new release, update
# `tag` and add the resulting `commit` so a moved tag cannot change the build.
#
# For a build against the working tree use the local manifest:
#   flatpak-builder build-dir io.github.clamguardian.ClamGuardian.local.yml
app-id: io.github.clamguardian.ClamGuardian
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: clamguardian
finish-args:
  # --- GUI -------------------------------------------------------------
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc
  # --- Host ClamAV -----------------------------------------------------
  # clamscan/freshclam are executed through `flatpak-spawn --host` and clamd is
  # reached over its UNIX socket on the host, so the sandbox needs to talk to
  # the flatpak portal and to read the host filesystem (socket + definitions).
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=host:ro
  # --- Network ---------------------------------------------------------
  # Only used for explicit, user-initiated third-party database downloads.
  - --share=network
  # --- Application data ------------------------------------------------
  # Quarantine vault, scan history and database state live in the app data dir.
  - --filesystem=xdg-data/clamguardian:create

modules:
  - name: clamguardian
    buildsystem: simple
    build-commands:
      # hatchling è il build-backend dichiarato in pyproject.toml; la wheel viene
      # scaricata come source (con rete) e installata offline dal build-dir.
      # hatchling + le sue dipendenze runtime (packaging, pathspec, pluggy,
      # tomlkit, trove-classifiers) vengono installate in .pep517-build e
      # rese importabili tramite PYTHONPATH: pattern standard Flathub per
      # build backend venduto, nessun download da PyPI durante la build.
      - mkdir -p .pep517-build && pip3 install --no-index --no-deps --target .pep517-build ./hatchling-1.32.4-py3-none-any.whl ./packaging-26.3-py3-none-any.whl ./pathspec-1.1.1-py3-none-any.whl ./pluggy-1.6.0-py3-none-any.whl ./tomlkit-0.15.2-py3-none-any.whl ./trove_classifiers-2026.9.21.13-py3-none-any.whl
      - PYTHONPATH=.pep517-build pip3 install --no-build-isolation --no-deps --no-index --prefix=/app .
      # Dipendenze runtime (cryptography, aiohttp + transitive): tutte elencate
      # esplicitamente come wheel locali, così pip non cerca la rete.
      - pip3 install --no-index --no-deps --prefix=/app ./cryptography-50.0.1-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl ./cffi-2.1.1-cp312-cp312-manylinux2014_x86_64.whl ./aiohttp-3.14.3-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl ./aiosignal-1.4.0-py3-none-any.whl ./charset_normalizer-3.5.1-py3-none-any.whl ./frozenlist-1.8.0-py3-none-any.whl ./multidict-6.9.1-py3-none-any.whl ./yarl-1.24.5-py3-none-any.whl ./attrs-26.1.0-py3-none-any.whl ./idna-3.19-py3-none-any.whl
      - install -Dm644 data/io.github.clamguardian.ClamGuardian.desktop /app/share/applications/io.github.clamguardian.ClamGuardian.desktop
      - install -Dm644 data/io.github.clamguardian.ClamGuardian.metainfo.xml /app/share/metainfo/io.github.clamguardian.ClamGuardian.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg /app/share/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg
