name: Release Gate

permissions:
  contents: read

on:
  push:
    branches: [feature]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [feature, testing]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLATPAK_RUNTIME: org.gnome.Platform//51
  FLATPAK_SDK: org.gnome.Sdk//51

jobs:
  preflight:
    name: Preflight — branch / HEAD / working tree
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preflight checks (read-only, no Git mutations)
        run: |
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "HEAD:   $(git rev-parse HEAD)"
          echo "Working tree:"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean — aborting gate"
            exit 1
          fi
          echo "::notice::Preflight OK: clean working tree on $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

  appstream:
    name: AppStream validation
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install appstream
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: Validate metainfo
        run: appstreamcli validate data/io.github.clamguardian.ClamGuardian.metainfo.xml

  clamav:
    name: Real ClamAV scan (clamscan + clamd)
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
      - name: Update virus database
        run: |
          sudo pkill -x freshclam || true
          sudo freshclam --stdout || sudo freshclam --log-verbose --log=/tmp/freshclam-ci.log || cat /tmp/freshclam-ci.log
      - name: Clean scan via clamscan
        run: |
          printf 'clean file content\n' > /tmp/clean.txt
          clamscan /tmp/clean.txt
      - name: EICAR detection via clamscan
        run: |
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.txt
          clamscan /tmp/eicar.txt || test $? -eq 1
      - name: Start clamd daemon
        run: |
          sudo mkdir -p /var/run/clamav
          sudo chown clamav:clamav /var/run/clamav
          sudo clamd
          for i in $(seq 1 10); do [ -S /var/run/clamav/clamd.ctl ] && exit 0; sleep 1; done
          echo "::error::clamd socket not available" && exit 1
      - name: Clean scan via clamdscan
        run: |
          printf 'clean file content\\n' > /tmp/clean2.txt
          clamdscan /tmp/clean2.txt
      - name: EICAR detection via clamdscan
        run: |
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar2.txt
          clamdscan /tmp/eicar2.txt || test $? -eq 1

  gtk-smoke:
    name: GTK smoke test
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install GTK / PyGObject system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev gir1.2-gtk-4.0 gir1.2-adw-1 libcairo2-dev pkg-config python3-dev xvfb xauth
      - name: Install clamguardian with GTK extra (system Python, GI typelib visible)
        run: python3 -m pip install --break-system-packages '.[gtk]'
      - name: Construct every GTK page, settings, stylesheet and About (headless via Xvfb)
        env:
          GTK_A11Y: none
        run: |
          xvfb-run -a python3 << 'PYEOF'
          import tempfile
          from pathlib import Path

          from clamguardian.core.settings import AppSettings, SettingsStore
          from clamguardian.databases import DatabaseManager
          from clamguardian.history.backend import SqliteHistoryStore
          from clamguardian.ui import build_database_navigation
          from clamguardian.ui.about import build_about_dialog
          from clamguardian.ui.app import SIDEBAR_ENTRIES, ClamGuardianApp, MainWindow
          from clamguardian.ui.controller import ShieldTaskController
          from clamguardian.ui.diagnostics_page import DiagnosticsPage
          from clamguardian.ui.quarantine_key import QuarantineKeyManager
          from clamguardian.ui.scan_page import ScanPage
          from clamguardian.ui.theme import load_css

          root = Path(tempfile.mkdtemp(prefix="clamguardian-test-"))
          manager = DatabaseManager(root / "databases", root / "state.json")
          view = build_database_navigation(manager)

          # `register()` emits GApplication::startup, which GTK requires before
          # any application window is created.
          app = ClamGuardianApp()
          assert app.register()

          settings_store = SettingsStore(root / "settings.json")
          settings_store.save(
              AppSettings(
                  default_profile_id="home",
                  notifications_enabled=False,
                  color_scheme="dark",
              )
          )
          window = MainWindow(
              app,
              checks=[],
              manager=manager,
              controller=ShieldTaskController(),
              history_store=SqliteHistoryStore(root / "history.db"),
              key_manager=QuarantineKeyManager(root / "quarantine"),
              settings_store=settings_store,
          )
          assert window.toast_overlay is not None
          assert load_css(), "application stylesheet must load"
          assert window.settings.default_profile_id == "home"

          expected_pages = {page_id for page_id, _label, _icon in SIDEBAR_ENTRIES}
          assert set(window.page_ids) == expected_pages
          for page_id in window.page_ids:
              window.show_page(page_id)
              assert window.visible_page_id == page_id

          page = DiagnosticsPage()
          assert page.checks, "diagnostics page must render at least one check"
          scan_page = ScanPage(ShieldTaskController())
          assert scan_page.root is not None
          assert not scan_page.in_flight
          assert build_about_dialog() is not None

          print("GTK UI construction OK — all pages, settings, stylesheet, About")
          PYEOF

  flatpak-local:
    name: Flatpak build — local manifest
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install GNOME Platform 51
        run: flatpak install --user flathub ${{ env.FLATPAK_RUNTIME }} -y
      - name: Install GNOME SDK 51
        run: flatpak install --user flathub ${{ env.FLATPAK_SDK }} -y
      - name: Build local manifest (working tree)
        run: flatpak-builder --repo=flatpak-repo build-dir-local packaging/flatpak/io.github.clamguardian.ClamGuardian.local.yml
      - name: Bundle local build as installable .flatpak
        run: flatpak build-bundle flatpak-repo io.github.clamguardian.ClamGuardian.flatpak io.github.clamguardian.ClamGuardian
      - name: Upload local Flatpak bundle
        # Named after the branch under test: on the feature → testing
        # promotion PR this artifact is the testable build for the testing
        # branch (same local manifest, same offline GNOME 51 build).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'testing' && 'ClamGuardian-testing-linux-x86_64.flatpak') || 'ClamGuardian-feature-linux-x86_64.flatpak' }}
          path: io.github.clamguardian.ClamGuardian.flatpak
          retention-days: 14

  flatpak-release:
    name: Flatpak build — release manifest
    needs: preflight
    runs-on: ubuntu-24.04
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Add Flathub remote
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install GNOME Platform 51
        run: flatpak install --user flathub ${{ env.FLATPAK_RUNTIME }} -y
      - name: Install GNOME SDK 51
        run: flatpak install --user flathub ${{ env.FLATPAK_SDK }} -y
      - name: Build release manifest (pinned to tag)
        run: flatpak-builder --repo=flatpak-repo build-dir-release packaging/flatpak/io.github.clamguardian.ClamGuardian.yml
      - name: Bundle release build as installable .flatpak
        run: flatpak build-bundle flatpak-repo io.github.clamguardian.ClamGuardian.flatpak io.github.clamguardian.ClamGuardian
      - name: Upload release Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClamGuardian-v1.0.1-linux-x86_64.flatpak
          path: io.github.clamguardian.ClamGuardian.flatpak
          retention-days: 90

  gate:
    name: Release gate summary
    needs: [preflight, appstream, clamav, gtk-smoke, flatpak-local, flatpak-release]
    # always(): must also run when flatpak-release failed on a tag push, so the
    # evidence reports the real outcome instead of staying silent. !cancelled():
    # do not run if the whole run was cancelled by a newer push (concurrency).
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Collect evidence
        run: |
          gate_failed=0
          check () {  # $1 = needs.<job>.result, $2 = label
            case "$1" in
              success) echo "  $2: OK" ;;
              skipped) echo "  $2: SKIPPED (not required on this ref)" ;;
              *) echo "  $2: FAILED ($1)"; gate_failed=1 ;;
            esac
          }
          {
            echo "ClamGuardian 1.0 — Release Gate Evidence"
            echo "============================================="
            echo ""
            echo "Commit:   $(git rev-parse HEAD)"
            echo "Branch:   $(git rev-parse --abbrev-ref HEAD)"
            echo "Date:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Gate results (scaletta punti 1–7):"
            check "${{ needs.preflight.result }}" "1. Preflight (branch/HEAD/working tree, sola lettura)"
            check "${{ needs.flatpak-local.result }}" "2+3. Flatpak build manifest locale (runtime 51, offline) + bundle"
            check "${{ needs.appstream.result }}" "4. AppStream validation (metainfo)"
            check "${{ needs.clamav.result }}" "5. ClamAV reale (clamscan + clamdscan, pulito + EICAR)"
            check "${{ needs.gtk-smoke.result }}" "6. GTK smoke (UI: tutte le pagine, impostazioni, stylesheet, About)"
            echo ""
            echo "Ref corrente:  ${{ github.ref }} (${{ github.ref_type }})"
            echo "Flatpak build manifest di release (job flatpak-release): ${{ needs.flatpak-release.result }}"
            echo ""
            echo "Punti 8–10: in attesa di autorizzazione esplicita."
            if [ "$gate_failed" -ne 0 ]; then
              echo ""
              echo "::error::Release gate FAILED — uno o più job richiesti non hanno superato i controlli"
              exit 1
            fi
          } > gate-evidence.txt
      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-evidence
          path: gate-evidence.txt
          retention-days: 30

