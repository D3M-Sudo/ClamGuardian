<path d="M759 162 H786" class="a"/>
<rect x="791" y="117" width="274" height="91" class="b rel"/><text x="928" y="151" class="l">v1.0.0 · RILASCIATA</text><text x="928" y="177" class="d">Gate verde · bundle Flatpak</text>
<text x="35" y="250" class="h">PROSSIMI PASSI</text>
<rect x="35" y="270" width="310" height="92" class="b next"/><text x="190" y="300" class="l">1.0.x · Stabilizzazione</text><text x="190" y="325" class="d">Documenti · test desktop</text><text x="190" y="345" class="d">Restore Flatpak</text>
<path d="M345 316 H375" class="a"/>
<rect x="380" y="270" width="310" height="92" class="b next"/><text x="535" y="300" class="l">v1.1.0 · USB Auto-Scan</text><text x="535" y="325" class="d">Mount safety · integrazione</text><text x="535" y="345" class="d">Test e gate dedicato</text>
<path d="M690 316 H720" class="a"/>
<rect x="725" y="270" width="340" height="92" class="b next"/><text x="895" y="300" class="l">v1.2.0 · Threat Intelligence</text><text x="895" y="325" class="d">VirusTotal via SHA-256</text><text x="895" y="345" class="d">Opt-in · rate limit · privacy</text>
<text x="35" y="410" class="h">LINEA MAGGIORE 2.x — DOPO REMEDIATION E AUDIT</text>
<rect x="35" y="430" width="310" height="92" class="b later"/><text x="190" y="460" class="l">v2.0.0 · Event-driven</text><text x="190" y="485" class="d">Fix P1 realtime · queue · shutdown</text><text x="190" y="505" class="d">Overflow e watch osservabili</text>
<path d="M345 476 H375" class="a"/>
<rect x="380" y="430" width="310" height="92" class="b later"/><text x="535" y="460" class="l">v2.1.x · Access prevention</text><text x="535" y="485" class="d">fanotify / clamonacc</text><text x="535" y="505" class="d">Threat model e privilegi</text>
<path d="M690 476 H720" class="a"/>
<rect x="725" y="430" width="340" height="92" class="b later"/><text x="895" y="460" class="l">v2.2.x · IPC privilegiato</text><text x="895" y="485" class="d">Daemon / IPC / Polkit</text><text x="895" y="505" class="d">Solo se necessario</text>
<rect x="35" y="560" width="1030" height="58" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="55" y="585" class="l" text-anchor="start">Regola di avanzamento</text><text x="55" y="605" class="d" text-anchor="start">Ogni milestone richiede test riproducibili, evidenze documentate e gate verde; nessuna data futura è promessa.</text>
