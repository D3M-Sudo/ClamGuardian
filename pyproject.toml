[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clamguardian"
version = "1.0.0"
description = "Security framework for ClamAV scanning, quarantine, and security management on Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ClamGuardian contributors" }]
dependencies = [
  "cryptography>=43.0",
  "aiohttp>=3.10",
]

[project.scripts]
clamguardian = "clamguardian.cli.main:main"

[project.optional-dependencies]
gtk = [
  "PyGObject>=3.46",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pyyaml>=6.0",  # packaging tests parse the Flatpak manifests
]

[tool.uv]
# PyGObject compiles against system libraries (girepository-2.0, cairo) and
# therefore lives in the optional `gtk` extra instead of the core
# dependencies: headless machines can resolve and run the test suite with
# plain `uvx --with '.[test]' pytest`, while full desktop environments opt in
# with `uvx --with '.[test,gtk]' pytest` or `uv sync --extra gtk --extra test`.
# The UI layer is import-safe without GTK (see clamguardian/ui/database_pages.py).
constraint-dependencies = [
  "pygobject>=3.53", # requires girepository-2.0 (libgirepository-2.0-dev on Debian/Ubuntu)
]


[tool.hatch.build.targets.wheel]
packages = ["clamguardian"]

# Desktop integration ships with the wheel so a plain `pip install` also installs
# the launcher, the AppStream metadata and the icon.
# Hatchling maps source (repository path) -> destination (inside the wheel).
[tool.hatch.build.targets.wheel.shared-data]
"data/io.github.clamguardian.ClamGuardian.desktop" = "share/applications/io.github.clamguardian.ClamGuardian.desktop"
"data/io.github.clamguardian.ClamGuardian.metainfo.xml" = "share/metainfo/io.github.clamguardian.ClamGuardian.metainfo.xml"
"data/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg" = "share/icons/hicolor/scalable/apps/io.github.clamguardian.ClamGuardian.svg"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["gi", "gi.repository.*", "aiohttp", "cryptography.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Dual implementation modules: GTK classes are conditionally defined
# (real widgets or headless import-safety shims), which mypy cannot model.
module = [
    "clamguardian.ui.about",
    "clamguardian.ui.database_pages",
    "clamguardian.ui.dialogs",
    "clamguardian.ui.diagnostics_page",
    "clamguardian.ui.app",
    "clamguardian.ui.history_page",
    "clamguardian.ui.notifications",
    "clamguardian.ui.quarantine_page",
    "clamguardian.ui.settings_page",
    "clamguardian.ui.theme",
]
disable_error_code = ["attr-defined", "no-redef", "misc", "assignment"]
