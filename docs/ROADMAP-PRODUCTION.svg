<rect x="35" y="560" width="1030" height="58" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="55" y="585" class="l" text-anchor="start">Vincoli</text><text x="55" y="605" class="d" text-anchor="start">Implementazione su feature ≠ release promossa. Public API resta bloccata; ogni gate richiede evidenze verificabili.</text>
